<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Open Graph image template</title>
    <style>
      @font-face {
        font-family: 'Inter Variable';
        font-weight: 100 900;
        src: url('../node_modules/@fontsource-variable/inter/files/inter-latin-wght-normal.woff2')
          format('woff2-variations');
      }

      html,
      body {
        height: 100%;
        margin: 0;
      }

      body {
        display: flex;
        align-items: center;
        gap: 56px;
        box-sizing: border-box;
        padding: 0 72px;
        font-family: 'Inter Variable', system-ui, sans-serif;
        color: #f2ece2;
        background: linear-gradient(135deg, #6b4226, #24150b);
      }

      img {
        flex: none;
        width: 440px;
        height: 440px;
        border-radius: 50%;
        box-shadow: 0 24px 60px rgb(0 0 0 / 55%);
      }

      h1 {
        margin: 0 0 20px;
        font-size: 76px;
        font-weight: 700;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }

      p {
        margin: 0;
        font-size: 32px;
        line-height: 1.3;
        color: #e8d9c2;
      }

      .tag {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 22px;
        font-size: 24px;
        font-weight: 600;
        color: #1a1208;
        background: #e8a838;
        border-radius: 999px;
      }
    </style>
  </head>
  <body>
    <img src="../public/favicon.svg" alt="" />
    <div>
      <h1>Ultra-Realistic Vinyl Player</h1>
      <p>A turntable in your browser. Motor, tonearm, strobe, scratching.</p>
      <span class="tag">Your music never leaves your device</span>
    </div>
  </body>
</html>
